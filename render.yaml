services:
  - type: web
    name: looksmaxx-io
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    # Arena and rooms are held in process memory; keep one shared game server.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      # Free-tier limits with headroom below the tested eight-player workload.
      - key: PUBLIC_LIMIT
        value: '6'
      - key: ROOM_LIMIT
        value: '6'
      - key: CONNECTION_LIMIT
        value: '6'
      - key: MAX_ROOMS
        value: '2'
      - key: LOG_METRICS
        value: 'true'
